name: Bug Report
description: File a bug report to help us improve OhMyNewTabPage
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug and help improve **OhMyNewTabPage**! Please provide as much detail as possible.
  
  - type: input
    id: extension_version
    attributes:
      label: OhMyNewTabPage Version
      description: What version of the extension are you running? (Check chrome://extensions)
      placeholder: e.g., 0.1.0
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the fault is.
      placeholder: e.g., Changing the theme from options doesn't update the font color dynamically.
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: List the steps clearly so we can replicate the issue.
      placeholder: |
        1. Open the options page.
        2. Set a custom font color manually.
        3. Change the active theme.
        4. Observe font color out of sync.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: e.g., The font color should adapt or persist correctly according to the chosen theme or manual override.

  - type: dropdown
    id: issue_type
    attributes:
      label: Issue Category
      description: What part of the extension is this related to?
      options:
        - Theme / Styling
        - Keyboard Navigation / Shortcuts
        - Options Page / Settings Persistence
        - Other Extension Fault
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: Browser version, operating system (e.g., Google Chrome 151.0 on Omarchy Linux).
      placeholder: |
        - OS: Omarchy Linux / Arch
        - Browser: Google Chrome 151.0
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any error logs from the extension background/popup console, or screenshots/GIFs if applicable.
